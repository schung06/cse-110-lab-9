<!DOCTYPE html>
<html lang="en">

<head>
  <script src="https://cdn.trackjs.com/agent/v3/latest/t.js"></script>
  <script>
    window.TrackJS && TrackJS.install({
      token: "ade53e77b93e4b14aafc979e6e79fa36"
      // for more configuration options, see https://docs.trackjs.com
    });
  </script>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 9</title>

  <style>
    button {
      margin: 3px;
    }

    button:hover {
      cursor: pointer;
    }

    #first-num,
    #second-num {
      width: 60px;
    }

    output {
      border: 1px solid gray;
      display: block;
      height: 18px;
      margin-top: 5px;
      padding: 5px;
      width: 240px;
    }

    main {
      width: 800px;
    }

    #error-btns {
      column-gap: 5px;
      display: flex;
      flex-wrap: wrap;
      margin-top: 30px;
      row-gap: 5px;
    }

    #error-btns>* {
      padding: 8px 2px;
      width: 122px;
    }
  </style>
</head>

<body>
  <main>
    <form>
      <fieldset>
        <legend>Error Calculator</legend>
        <input name="first-num" id="first-num" />
        <select name="operator" id="operator">
          <option>+</option>
          <option>-</option>
          <option>*</option>
          <option>/</option>
        </select>
        <input name="second-num" id="second-num" />
        <button id="calculate">Calculate</button>
        <br />
        <output></output>
      </fieldset>
    </form>

    <section id="error-btns">
      <button>Console Log</button>
      <button>Console Error</button>
      <button>Console Count</button>
      <button>Console Warn</button>
      <button>Console Assert</button>
      <button>Console Clear</button>
      <button>Console Dir</button>
      <button>Console dirxml</button>
      <button>Console Group Start</button>
      <button>Console Group End</button>
      <button>Console Table</button>
      <button>Start Timer</button>
      <button>End Timer</button>
      <button>Console Trace</button>
      <button>Trigger a Global Error</button>
    </section>
  </main>

  <script>
    let form = document.querySelector('form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      let output = document.querySelector('output');
      let firstNum = document.querySelector('#first-num').value;
      let secondNum = document.querySelector('#second-num').value;
      let operator = document.querySelector('#operator').value;
      output.innerHTML = eval(`${firstNum} ${operator} ${secondNum}`);
    });

    let errorBtns = Array.from(document.querySelectorAll('#error-btns > button'));

    // Start your code here
    // You may move this JS to another file if you wish

    // Step 2 - Adding Buttons for Console Testing
    const mockData = [
      {name: 'John Smith', age: 30},
      {name: 'Jane Doe', age: 30}
    ];

    const handleBtnClick = [
      // Console Log
      () => console.log('Console Log Demo', { message: 'Testing, hello world', count: 3 }),
      
      // Console Error
      () => console.error('Console Error Demo', new Error('Test error')),
      
      // Console Count
      () => console.count('Count Button'),
      
      // Console Warn
      () => console.warn('Console Warn Button', 'Warning'),
      
      // Console Assert
      () => console.assert(false, { number: 6, errorMsg: 'The number does not equal 7' }),
      
      // Console Clear
      () => console.clear(),
      
      // Console Dir
      () => console.dir(errorBtns[6]),
      
      // Console dirxml
      () => console.dirxml(errorBtns[7]),
      
      // Console Group Start
      () => {
        console.group('console.group');
        console.log('Grouped message 1');
        console.log('Grouped message 2', mockData);
      },
      
      // Console Group End
      () => console.groupEnd(),
      
      // Console Table
      () => console.table(mockData),
      
      // Start Timer
      () => console.time('Timer Button'),
      
      // End Timer
      () => console.timeEnd('Timer Button'),
      
      // Console Trace
      () => {
        function deep() {
          function deeper() {
            function deepest() {
              console.trace('console.trace');
            }
            deepest();
          }
          deeper();
        }
        deep();
      }, 
      
      // Step 5 - The Global Error handler and 3rd Party Tracking
      () => {
        try {
          document.querySelector("button").deep();
        } catch (err) {
          console.error(err); 
        }
      }
    ];

    errorBtns.forEach((btn, idx) => {
      if (handleBtnClick[idx]) btn.addEventListener('click', handleBtnClick[idx]);
    });

    // Step 4 - Throw and Custom Errors
    class CustomError extends Error {
      constructor(message) {
        super(message);
        this.name = 'Custom Error';
      }
    };

    // Step 3 - Trying Try / Catch and Throw CustomError
    try {
      throw new CustomError('This is a custom error');
    } catch (err) {
      console.error(err);
    };
  

  </script>
</body>

</html>
